<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>View sellers · Closet Sales Namibia</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Jost:wght@500;600;700&amp;family=Sacramento&amp;display=swap"
  rel="stylesheet"
/>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="css/style.css?v=2026-09-01a" />
<script src="js/errors.js?v=2026-09-01a"></script>
<script src="js/theme.js?v=2026-09-01a"></script>
</head>
<body data-page="sellers">
  <div class="page">
    <main>
      <section class="band band--white">
        <div class="shell shell--wide">
          <h2 class="section-title">View Sellers</h2>
          <div class="heart-row" aria-hidden="true"></div>

          <p class="text-center muted" style="margin-bottom:26px;">
            Search by name or username, then open a seller to see everything in their closet.
          </p>

          <form class="seller-search" data-seller-form>
            <label class="visually-hidden" for="seller-q">Search sellers</label>
            <input
              id="seller-q"
              type="search"
              data-seller-input
              placeholder="Search sellers…"
              autocomplete="off"
            />
            <button type="submit" class="btn btn--primary">Search</button>
          </form>

          <p class="text-center seller-count" data-seller-count></p>
          <p class="text-center muted" data-seller-status>Loading sellers…</p>

          <div class="frame">
            <div class="tile-grid" data-seller-grid></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="js/layout.js?v=2026-09-01a"></script>
  <script type="module" src="js/sellers.js?v=2026-09-01a"></script>
</body>
</html>
