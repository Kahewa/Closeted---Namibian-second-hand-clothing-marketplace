<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop all closets — Closet Sales Namibia</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap"
  rel="stylesheet"
/>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="shop">
  <div class="page">
    <main>
      <section class="band band--white">
        <div class="shell shell--wide">
          <h2 class="section-title">shop every closet</h2>
          <div class="heart-row" aria-hidden="true"></div>

          <p class="text-center muted" style="font-size:13px;margin-bottom:18px;">
            Tap any closet to open it and swipe through everything inside.
          </p>

          <p class="text-center muted" data-shop-loading>Loading closets…</p>

          <div class="empty-state" data-shop-empty hidden>
            <div class="empty-state__icon"><i class="ico ico--shirt ico--xl" aria-hidden="true"></i></div>
            <p class="h3">No closets yet</p>
            <p class="muted" style="margin-top:6px;">Be the first — your closet could be today's top drop.</p>
            <a href="sell.html" class="btn btn--primary" style="margin-top:16px;">sell your closet</a>
          </div>

          <div class="tile-grid" data-shop-grid></div>

          <div class="text-center" style="margin-top:22px;">
            <button type="button" class="btn btn--chrome" data-shop-more hidden>load more closets</button>
          </div>
        </div>
      </section>

      <div class="checker-bar" aria-hidden="true"></div>
    </main>

    <!-- opened when a tile is tapped -->
    <div class="modal lightbox" data-shop-modal hidden>
      <div class="modal__backdrop" data-shop-close></div>
      <div class="lightbox__panel" role="dialog" aria-modal="true" aria-label="Closet sale">
        <button type="button" class="modal__x lightbox__x" data-shop-close aria-label="Close">
          <i class="ico ico--close" aria-hidden="true"></i>
        </button>
        <div data-shop-detail></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/shop.js"></script>
</body>
</html>
