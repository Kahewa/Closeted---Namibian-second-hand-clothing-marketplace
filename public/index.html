<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Closet Sales Namibia — Pre-Loved Fashion</title>
<meta name="description" content="Pre-loved shirts, dresses, shoes and more, posted fresh in Namibia. Filter by what you want and ask about any piece on WhatsApp." />
<meta property="og:title" content="Closet Sales Namibia — Pre-Loved Fashion" />
<meta property="og:description" content="Pre-loved shirts, dresses, shoes and more, posted fresh in Namibia. Filter by what you want and ask about any piece on WhatsApp." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Righteous&family=Sacramento&family=Syne:wght@700;800&family=Space+Grotesk:wght@600;700&display=swap"
  rel="stylesheet"
/>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="home">
  <div class="page">
    <main>
      <section class="hero">
        <div class="sparkle-field" aria-hidden="true">
          <span class="sparkle" style="top:12%; left:8%;"></span>
          <span class="sparkle sparkle--sm" style="top:26%; right:10%; animation-delay: 1.2s;"></span>
          <span class="sparkle" style="bottom:18%; left:16%; animation-delay: 0.7s;"></span>
          <span class="sparkle sparkle--sm" style="top:70%; right:14%; animation-delay: 1.8s;"></span>
        </div>

        <div class="hero__inner">
          <div class="hero__badge">
            <span>✦ PRE-LOVED FASHION · NAMIBIA ✦</span>
          </div>

          <h1 class="hero__title">
            FRESH DROPS.
            <span class="hero__highlight">Second Life</span>
          </h1>

          <p class="hero__lead">
            Hand-picked pre-loved pieces, photographed one by one. Pick a category, find your size,
            and tap to ask about it on WhatsApp.
          </p>

          <div class="hero__cta-row">
            <a href="#browse" class="btn btn--primary">Shop the feed</a>
          </div>
        </div>
      </section>

      <section class="browse" id="browse">
        <div class="shell shell--wide">
          <h2 class="browse__title">Browse Pieces</h2>

          <div class="filter-bar" role="group" aria-label="Filter by category" data-filters></div>

          <div class="empty-state" data-empty-state hidden>
            <div class="empty-state__icon"><i class="ico ico--shirt ico--xl" aria-hidden="true"></i></div>
            <p class="h3" data-empty-title>Nothing posted yet</p>
            <p class="muted" data-empty-body style="margin-top:6px;">New pieces are on the way. Check back soon.</p>
          </div>

          <div class="item-grid" data-feed></div>

          <div class="text-center" style="margin-top:48px;">
            <button type="button" class="btn btn--chrome" data-load-more>Load more</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/feed.js"></script>
</body>
</html>
