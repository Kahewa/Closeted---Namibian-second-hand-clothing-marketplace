<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile — Closet.bg</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Space+Mono:wght@400;700&amp;display=swap"
  rel="stylesheet"
/>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <div class="sparkle-field" aria-hidden="true">
      <span class="sparkle" style="top:8%;right:-7%;"></span>
      <span class="sparkle sparkle--ink" style="top:40%;left:3%;animation-delay:1.8s;"></span>
      <span class="sparkle sparkle--sm" style="top:76%;right:-2%;animation-delay:2.6s;"></span>
    </div>

    <header class="navbar">
      <div class="navbar__inner">
        <a href="index.html" class="logo">
          <span class="logo__closet">Closet</span><span class="logo__bg">.bg</span>
        </a>
        <nav class="navlinks">
          <a href="sell.html" class="btn btn--primary btn--sm">Sell</a>
          <span data-nav-auth></span>
        </nav>
      </div>
    </header>

    <main>
      <div class="shell shell--wide">
        <p class="text-center muted" data-profile-loading style="padding-top:60px;">Loading closet…</p>

        <div class="empty-state" data-profile-signed-out hidden style="margin-top:40px;">
          <div class="empty-state__icon">🔒</div>
          <p class="h3">Log in to see your profile</p>
          <p class="muted" style="margin-top:6px;">Or open someone else's profile straight from the feed.</p>
          <a href="login.html" class="btn btn--primary" style="margin-top:16px;">Log in</a>
        </div>

        <div data-profile-content hidden>
          <section class="profile-header" data-profile-header id="contact">
            <div class="profile-header__top">
              <label class="avatar-upload" data-avatar-upload hidden>
                <img data-avatar class="avatar-bubble avatar-bubble--lg" alt="Profile picture" hidden />
                <span data-avatar-initials class="avatar-bubble avatar-bubble--lg"></span>
                <input type="file" accept="image/*" data-avatar-input />
              </label>

              <div class="profile-header__name-block">
                <h1 class="h2" data-display-name>—</h1>
                <p class="profile-bio" data-bio-view></p>
                <div class="profile-socials" data-social-view></div>

                <div class="profile-actions">
                  <button type="button" class="btn btn--chrome btn--sm" data-edit-toggle hidden>✏️ Edit profile</button>
                  <a href="sell.html" class="btn btn--lime btn--sm" data-sell-cta hidden>Sell more</a>
                </div>
              </div>
            </div>

            <div class="profile-edit-form" data-edit-form>
              <div class="field">
                <label for="bio-edit">Bio</label>
                <textarea id="bio-edit" data-bio-edit maxlength="280" placeholder="Tell buyers a bit about your closet…"></textarea>
              </div>
              <div class="social-edit-grid">
                <div class="field">
                  <label for="social-instagram">📸 Instagram</label>
                  <input id="social-instagram" type="text" name="instagram" placeholder="instagram.com/yourname" />
                </div>
                <div class="field">
                  <label for="social-tiktok">🎵 TikTok</label>
                  <input id="social-tiktok" type="text" name="tiktok" placeholder="tiktok.com/@yourname" />
                </div>
                <div class="field">
                  <label for="social-facebook">📘 Facebook</label>
                  <input id="social-facebook" type="text" name="facebook" placeholder="facebook.com/yourname" />
                </div>
                <div class="field">
                  <label for="social-whatsapp">💬 WhatsApp number</label>
                  <input id="social-whatsapp" type="tel" name="whatsapp" placeholder="+264 81 234 5678" />
                </div>
              </div>
              <div class="edit-actions">
                <button type="button" class="btn btn--primary" data-save-profile>💾 Save changes</button>
                <button type="button" class="btn btn--outline" data-cancel-edit>Cancel</button>
              </div>
            </div>
          </section>

          <div class="listings-divider">closet drops</div>

          <div class="empty-state" data-listings-empty hidden>
            <div class="empty-state__icon">👗</div>
            <p class="h3">Nothing here yet</p>
            <p class="muted" data-listings-empty-body style="margin-top:6px;"></p>
          </div>

          <div data-listings></div>
        </div>
      </div>
    </main>

    <footer class="site-footer">Closet By Grace — made for Namibia's secondhand fashion scene 🇳🇦</footer>
  </div>

  <script type="module" src="js/nav.js"></script>
  <script type="module" src="js/profile.js"></script>
</body>
</html>
