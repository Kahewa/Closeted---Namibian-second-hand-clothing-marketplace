<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Account Access — Closet Sales Namibia</title>
<meta name="description" content="Sign in or join Closet Sales Namibia to drop your pre-loved closet or connect with buyers on WhatsApp." />
<meta property="og:title" content="Account Access — Closet Sales Namibia" />
<meta property="og:description" content="Sign in or join Closet Sales Namibia to drop your pre-loved closet or connect with buyers on WhatsApp." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Righteous&family=Sacramento&family=Syne:wght@700;800&family=Space+Grotesk:wght@600;700&display=swap"
  rel="stylesheet"
/>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login">
  <div class="page auth-page">
    <div class="sparkle-field" aria-hidden="true">
      <span class="sparkle" style="top: 15%; left: 10%;"></span>
      <span class="sparkle sparkle--sm" style="top: 30%; right: 12%; animation-delay: 1.1s;"></span>
      <span class="sparkle" style="bottom: 20%; left: 18%; animation-delay: 0.6s;"></span>
      <span class="sparkle sparkle--sm" style="bottom: 35%; right: 20%; animation-delay: 1.8s;"></span>
    </div>

    <div class="shell" style="position: relative; z-index: 2;">
      <div class="auth-card glass-card" data-win="USER AUTHENTICATION · 2000s">
        <div class="logo logo--center" style="margin-top: 8px;">
          <span class="logo__closet">closet sales</span><span class="logo__bg">namibia</span>
        </div>
        <p class="muted text-center" style="margin-top: 4px; margin-bottom: 24px; font-size: 14px; font-weight: 500;">
          ✦ Buy What's Dropped · Sell Your Closet ✦
        </p>

        <div class="auth-tabs">
          <button type="button" class="auth-tab auth-tab--active" data-tab="signin">Sign In</button>
          <button type="button" class="auth-tab" data-tab="signup">Join Closet</button>
        </div>

        <div data-panel="signin">
          <form data-signin-form novalidate>
            <div class="field">
              <label for="signin-email" style="font-weight: 700;">Email Address</label>
              <input id="signin-email" type="email" name="email" required autocomplete="email" placeholder="name@example.com" />
            </div>
            <div class="field">
              <label for="signin-password" style="font-weight: 700;">Password</label>
              <input id="signin-password" type="password" name="password" required autocomplete="current-password" placeholder="••••••••" />
            </div>
            <button class="btn btn--primary btn--block" type="submit" style="margin-top: 12px; font-size: 15px;">
              ✦ Sign In To Closet
            </button>
          </form>
        </div>

        <div data-panel="signup" hidden>
          <form data-signup-form novalidate>
            <div class="field">
              <label for="signup-name" style="font-weight: 700;">Full Name</label>
              <input id="signup-name" type="text" name="name" required autocomplete="name" placeholder="Grace Shilongo" />
            </div>
            <div class="field">
              <label for="signup-username" style="font-weight: 700;">Username / Handle</label>
              <input id="signup-username" type="text" name="username" required maxlength="20" placeholder="grace.closet" autocomplete="off" />
              <p class="muted" style="font-size: 11.5px; margin-top: 4px;">
                3–20 characters (lowercase letters, numbers, dots, underscores). This is your payment reference and link!
              </p>
            </div>
            <div class="field">
              <label for="signup-email" style="font-weight: 700;">Email Address</label>
              <input id="signup-email" type="email" name="email" required autocomplete="email" placeholder="name@example.com" />
            </div>
            <div class="field">
              <label for="signup-password" style="font-weight: 700;">Create Password</label>
              <input id="signup-password" type="password" name="password" required minlength="6" autocomplete="new-password" placeholder="Min. 6 characters" />
            </div>
            <button class="btn btn--primary btn--block" type="submit" style="margin-top: 12px; font-size: 15px;">
              ✦ Create Seller Account
            </button>
          </form>
        </div>

        <div class="divider-or">OR CONNECT WITH</div>

        <button type="button" class="btn btn--google btn--block" data-google-btn>
          <span class="google-g">G</span> Continue with Google
        </button>

        <p class="muted text-center" style="margin-top: 22px; font-size: 13.5px;">
          <a href="index.html" style="color: var(--hot-pink); font-weight: 700; text-decoration: none;">← Back to Closet Feed</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
