<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Closet Sales Namibia</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Jost:wght@500;600;700&amp;family=Sacramento&amp;display=swap"
  rel="stylesheet"
/>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login">
  <div class="page auth-page">

    <div class="shell">
      <div class="auth-card glass-card">
        <div class="logo logo--center">
          <span class="logo__closet">closet sales</span><span class="logo__bg">namibia</span>
        </div>
        <p class="muted text-center" style="margin-top:-10px; margin-bottom:18px; font-size:14px;">
          Buy what's dropped. Sell what's collecting dust.
        </p>

        <div class="auth-tabs">
          <button type="button" class="auth-tab auth-tab--active" data-tab="signin">Log in</button>
          <button type="button" class="auth-tab" data-tab="signup">Sign up</button>
        </div>

        <div data-panel="signin">
          <form data-signin-form novalidate>
            <div class="field">
              <label for="signin-email">Email</label>
              <input id="signin-email" type="email" name="email" required autocomplete="email" />
            </div>
            <div class="field">
              <label for="signin-password">Password</label>
              <input id="signin-password" type="password" name="password" required autocomplete="current-password" />
            </div>
            <button class="btn btn--primary btn--block" type="submit">Log in</button>
          </form>
        </div>

        <div data-panel="signup" hidden>
          <form data-signup-form novalidate>
            <div class="field">
              <label for="signup-name">Your name</label>
              <input id="signup-name" type="text" name="name" required autocomplete="name" />
            </div>
            <div class="field">
              <label for="signup-username">Username</label>
              <input id="signup-username" type="text" name="username" required maxlength="20" placeholder="grace.closet" autocomplete="off" />
              <p class="muted" style="font-size:11px;">
                3–20 characters: lowercase letters, numbers, dots or underscores. People search
                for you by this, and it's your payment reference.
              </p>
            </div>
            <div class="field">
              <label for="signup-email">Email</label>
              <input id="signup-email" type="email" name="email" required autocomplete="email" />
            </div>
            <div class="field">
              <label for="signup-password">Password</label>
              <input id="signup-password" type="password" name="password" required minlength="6" autocomplete="new-password" />
            </div>
            <button class="btn btn--primary btn--block" type="submit">Sign up</button>
          </form>
        </div>

        <div class="divider-or">or</div>

        <button type="button" class="btn btn--google btn--block" data-google-btn>
          <span class="google-g">G</span> Continue with Google
        </button>

        <p class="muted text-center" style="margin-top:18px; font-size:13px;">
          <a href="index.html">← Back to browsing</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
